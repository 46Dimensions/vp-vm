name: MacOS setup script

on:
  push:
    paths:
      - '**/*.sh'
      - '**/macos-setup.yml'
  pull_request:
    paths:
      - '**/*.sh'
  workflow_dispatch:

jobs:
  run-installer:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run setup.sh
        run: sh setup.sh
